name: executable-labs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install local CPU dependencies
        run: uv sync --extra dev
      - name: Lint
        run: uv run ruff check src tests
      - name: Unit and local integration tests
        run: uv run pytest -q
      - name: Three-project local smoke
        run: uv run ml-labs smoke --work .ml-labs/ci-smoke
